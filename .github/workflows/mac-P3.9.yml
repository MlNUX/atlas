#
# Task P3.9 (macOS port): settings – build, unit tests, settings window open,
# screenshots in the log (apps/macos/scripts/ci-screenshots.sh), settings window (⌘,).
name: mac-P3.9

on:
  push:
    branches: ["port/macos/P3.9-*"]
    paths:
      - ".github/workflows/mac-P3.9.yml"
      - "apps/macos/**"
      - "crates/atlas-api/**"
      - "crates/atlas-ffi/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-P3.9-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    uses: ./.github/workflows/macos-setup.yml
    with:
      run: ATLAS_CI_SETTINGS=1 apps/macos/scripts/ci-app.sh
      artifact-name: mac-P3.9
      cache-key: P3.9
