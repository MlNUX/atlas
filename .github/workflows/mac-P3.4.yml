#
# Task P3.4 (macOS port): text and code editor – build, unit tests, sample
# project opened on a Rust file with its symbols (screenshots in the log).
name: mac-P3.4

on:
  push:
    branches: ["port/macos/P3.4-*"]
    paths:
      - ".github/workflows/mac-P3.4.yml"
      - "apps/macos/**"
      - "crates/atlas-api/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-P3.4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    uses: ./.github/workflows/macos-setup.yml
    with:
      # On failure the test lines of xcodebuild and a crash report into the log.
      run: |
        defaults write de.minux.atlas AtlasCodeSymbols -bool YES
        ATLAS_CI_OPEN_FILE=Skripte/main.rs apps/macos/scripts/ci-app.sh || {
          grep -aE -A2 "ATLAS-DIAG|✘|rash|Fatal|Restart|signal|unexpected|Assertion|Thread [0-9]+ Crashed" \
            "$ATLAS_CI_OUT/xcodebuild.log" | grep -v "Connection\]" | tail -n 120
          report="$(ls -t ~/Library/Logs/DiagnosticReports/Atlas* 2>/dev/null | head -n 1 || true)"
          if [[ -n "$report" ]]; then echo "== $report"; head -c 6000 "$report"; fi
          exit 1
        }
      artifact-name: mac-P3.4
      cache-key: P3.4
