#
# Task P0.5 (macOS port): terminal spike - SwiftTerm vs. atlas-terminal grid
# with a Swift renderer. Removed again in P4.2.
name: mac-P0.5

on:
  push:
    branches:
      - "port/macos/P0.5-*"
    paths:
      - ".github/workflows/mac-P0.5.yml"
      - "spikes/terminal/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-P0.5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spike:
    uses: ./.github/workflows/macos-setup.yml
    with:
      run: spikes/terminal/run.sh
      artifact-name: mac-P0.5
      cache-key: P0.5
