#
# Task P3.11 (macOS port): ILIAS – build, unit tests, open the `ilias:` tab,
# screenshots in the log (apps/macos/scripts/ci-screenshots.sh), tab open (no network login in CI).
name: mac-P3.11

on:
  push:
    branches: ["port/macos/P3.11-*"]
    paths:
      - ".github/workflows/mac-P3.11.yml"
      - "apps/macos/**"
      - "crates/atlas-api/**"
      - "crates/atlas-ffi/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-P3.11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    uses: ./.github/workflows/macos-setup.yml
    with:
      run: "ATLAS_CI_OPEN_FILE=ilias: apps/macos/scripts/ci-app.sh"
      artifact-name: mac-P3.11
      cache-key: P3.11
