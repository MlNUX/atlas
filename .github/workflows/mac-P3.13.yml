#
# Task P3.13 (macOS port): the macOS calendars (EventKit) – build, unit tests, calendar tab open,
# screenshots in the log (apps/macos/scripts/ci-screenshots.sh), calendar tab open.
name: mac-P3.13

on:
  push:
    branches: ["port/macos/P3.13-*"]
    paths:
      - ".github/workflows/mac-P3.13.yml"
      - "apps/macos/**"
      - "crates/atlas-api/**"
      - "crates/atlas-ffi/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-P3.13-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    uses: ./.github/workflows/macos-setup.yml
    with:
      run: "ATLAS_CI_OPEN_FILE=calendar: apps/macos/scripts/ci-app.sh"
      artifact-name: mac-P3.13
      cache-key: P3.13
