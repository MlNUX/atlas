#
# Task P0.6 (macOS port): report of everything in atlas-core that breaks on
# macOS without poppler/cairo/glib, plus atlas-terminal/atlas-spell tests.
name: mac-P0.6

on:
  push:
    branches: ["port/macos/P0.6-*"]
    paths:
      - ".github/workflows/mac-P0.6.yml"
      - "apps/macos/scripts/core-without-poppler.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-P0.6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    uses: ./.github/workflows/macos-setup.yml
    with:
      run: apps/macos/scripts/core-without-poppler.sh
      artifact-name: mac-P0.6
      cache-key: P0.6
