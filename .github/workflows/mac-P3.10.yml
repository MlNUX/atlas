#
# Task P3.10 (macOS port): actions and extensions – build, unit tests, sample project,
# screenshots in the log (apps/macos/scripts/ci-screenshots.sh), bundled extension view open.
name: mac-P3.10

on:
  push:
    branches: ["port/macos/P3.10-*"]
    paths:
      - ".github/workflows/mac-P3.10.yml"
      - "apps/macos/**"
      - "crates/atlas-api/**"
      - "crates/atlas-ffi/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-P3.10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    uses: ./.github/workflows/macos-setup.yml
    with:
      run: "ATLAS_CI_EXTENSION=bnki apps/macos/scripts/ci-app.sh"
      artifact-name: mac-P3.10
      cache-key: P3.10
