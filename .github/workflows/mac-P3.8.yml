#
# Task P3.8 (macOS port): the project search – build, unit tests, search window with matches,
# screenshots in the log (apps/macos/scripts/ci-screenshots.sh), search window open.
name: mac-P3.8

on:
  push:
    branches: ["port/macos/P3.8-*"]
    paths:
      - ".github/workflows/mac-P3.8.yml"
      - "apps/macos/**"
      - "crates/atlas-api/**"
      - "crates/atlas-ffi/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-P3.8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    uses: ./.github/workflows/macos-setup.yml
    with:
      run: ATLAS_CI_SEARCH=Algebra apps/macos/scripts/ci-app.sh
      artifact-name: mac-P3.8
      cache-key: P3.8
