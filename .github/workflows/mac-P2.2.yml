#
# Task P2.2 (macOS port): atlas-api (project, sessions, files) on macOS,
# with and without the UniFFI feature.
name: mac-P2.2

on:
  push:
    branches: ["port/macos/P2.2-*"]
    paths:
      - ".github/workflows/mac-P2.2.yml"
      - "crates/atlas-api/**"
      - "crates/atlas-core/**"
      - "crates/atlas-terminal/**"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-P2.2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/macos-setup.yml
    with:
      artifact-name: mac-P2.2
      cache-key: P2.2
      run: |
        export CARGO_TERM_COLOR=never
        cargo test --locked -p atlas-api 2>&1 | tee "$ATLAS_CI_OUT/cargo-test.log"
        cargo check --locked -p atlas-api --features ffi 2>&1 | tee "$ATLAS_CI_OUT/cargo-check-ffi.log"
        {
          echo "# P2.2 – atlas-api auf macOS"
          echo
          echo '```'
          grep -E '^test result|FAILED|^error|^warning' "$ATLAS_CI_OUT/cargo-test.log" "$ATLAS_CI_OUT/cargo-check-ffi.log" || true
          echo '```'
        } >"$ATLAS_CI_OUT/summary.md"
