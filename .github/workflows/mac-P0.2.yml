# Spike P0.2 (macOS port): UniFFI Rust -> XCFramework -> Swift package -> SwiftUI app.
name: mac-P0.2

on:
  push:
    branches: ["port/macos/P0.2-*"]
    paths:
      - ".github/workflows/mac-P0.2.yml"
      - "spikes/uniffi/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-P0.2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spike:
    uses: ./.github/workflows/macos-setup.yml
    with:
      run: spikes/uniffi/ci.sh
      artifact-name: mac-P0.2
      cache-key: P0.2
      cargo-workspaces: spikes/uniffi -> target
