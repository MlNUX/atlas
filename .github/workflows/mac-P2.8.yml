#
# Task P2.8 (macOS port): atlas-api (editor, settings, context bar, spelling) on macOS,
# with and without the UniFFI feature.
name: mac-P2.8

on:
  push:
    branches: ["port/macos/P2.8-*"]
    paths:
      - ".github/workflows/mac-P2.8.yml"
      - "crates/atlas-api/**"
      - "crates/atlas-core/**"
      - "crates/atlas-spell/**"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-P2.8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/macos-setup.yml
    with:
      artifact-name: mac-P2.8
      cache-key: P2.8
      run: |
        export CARGO_TERM_COLOR=never
        cargo test --locked -p atlas-api --test editor 2>&1 | tee "$ATLAS_CI_OUT/cargo-test.log"
        cargo check --locked -p atlas-api --features ffi 2>&1 | tee "$ATLAS_CI_OUT/cargo-check-ffi.log"
        {
          echo "# P2.8 – atlas-api auf macOS"
          echo
          echo '```'
          grep -E '^test result|FAILED|^error|^warning' "$ATLAS_CI_OUT/cargo-test.log" "$ATLAS_CI_OUT/cargo-check-ffi.log" || true
          echo '```'
        } >"$ATLAS_CI_OUT/summary.md"
