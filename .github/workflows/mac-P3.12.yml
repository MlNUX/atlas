#
# Task P3.12 (macOS port): viewers – build, unit tests, a picture of the sample project open,
# screenshots in the log (apps/macos/scripts/ci-screenshots.sh), image tab open.
name: mac-P3.12

on:
  push:
    branches: ["port/macos/P3.12-*"]
    paths:
      - ".github/workflows/mac-P3.12.yml"
      - "apps/macos/**"
      - "crates/atlas-api/**"
      - "crates/atlas-ffi/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-P3.12-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    uses: ./.github/workflows/macos-setup.yml
    with:
      run: ATLAS_CI_OPEN_FILE=Bild.png apps/macos/scripts/ci-app.sh
      artifact-name: mac-P3.12
      cache-key: P3.12
