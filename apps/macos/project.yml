#
# The macOS app (P3.0). The Xcode project is generated from this file
# (`xcodegen generate` in apps/macos; done by apps/macos/scripts/ci-app.sh)
# and not checked in: new Swift files in a folder are picked up without
# touching a project file, so feature tasks never conflict on it.
name: Atlas
options:
  bundleIdPrefix: de.minux
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: de
settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Ad hoc signing until the Apple Developer account exists (E5).
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.1.5"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  AtlasKit:
    path: AtlasKit
  # Updates (P4.4); the binary package brings its XPC services and helpers.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  Atlas:
    type: application
    platform: macOS
    sources:
      - Atlas
      # The web pages shared with Linux (bridge of extension views, Markdown
      # preview, KaTeX, Mermaid, highlight.js) as Resources/web, served as
      # atlas://app/web/… (P3.10, P3.3).
      - path: ../../crates/atlas-app/web
        type: folder
        buildPhase: resources
    dependencies:
      - package: AtlasKit
        product: AtlasKit
      - package: Sparkle
        product: Sparkle
    # Merged with the generated Info.plist (GENERATE_INFOPLIST_FILE).
    info:
      path: Atlas/Info.plist
      properties:
        SUFeedURL: $(ATLAS_FEED_URL)
        SUPublicEDKey: $(ATLAS_SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
    settings:
      base:
        # The appcast of the releases; the public EdDSA key of the release
        # signature (packaging/macos/README.md, „Updates“). Empty: no updater.
        ATLAS_FEED_URL: https://github.com/MlNUX/atlas/releases/latest/download/appcast.xml
        ATLAS_SPARKLE_PUBLIC_KEY: ""
        PRODUCT_BUNDLE_IDENTIFIER: de.minux.atlas
        PRODUCT_NAME: Atlas
        INFOPLIST_KEY_CFBundleDisplayName: Atlas
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Minux · GPL-3.0-or-later"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AtlasTests:
    type: bundle.unit-test
    platform: macOS
    sources: [AtlasTests]
    dependencies:
      - target: Atlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.minux.atlas.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Atlas.app/Contents/MacOS/Atlas"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Atlas:
    build:
      targets:
        Atlas: all
        AtlasTests: [test]
    test:
      targets: [AtlasTests]
