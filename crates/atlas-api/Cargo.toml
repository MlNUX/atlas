[package]
name = "atlas-api"
description = "UI-neutral facade over the Atlas core (used by the SwiftUI app via atlas-ffi)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# UniFFI derives and exports (atlas-ffi turns them on). Without it the crate
# has no UniFFI dependency.
ffi = ["dep:uniffi"]
# PDF engine of the core (Linux); the macOS app runs without it.
pdf-poppler = ["atlas-core/pdf-poppler"]

[dependencies]
atlas-core = { path = "../atlas-core", default-features = false }
atlas-spell = { path = "../atlas-spell" }
atlas-ilias = { path = "../atlas-ilias" }
anyhow = "1"
thiserror = "2"
futures-channel = "0.3"
log = "0.4"
uniffi = { version = "0.32", optional = true }

[dev-dependencies]
tempfile = "3"
