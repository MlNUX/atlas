[package]
name = "atlas-app"
description = "Qt 6 / QML desktop shell of Atlas Workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "atlas"
path = "src/main.rs"

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
atlas-core = { path = "../atlas-core" }
chrono = "0.4"
chrono-tz = "0.10"
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["full"] }
env_logger = "0.11"
libc = "0.2"
log = "0.4"
serde_json = "1"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
