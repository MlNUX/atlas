[package]
name = "atlas-ilias"
description = "ILIAS access of Atlas Workspace: reading courses and downloading files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1"
atlas-core = { path = "../atlas-core" }
chrono = "0.4"
log = "0.4"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
scraper = "0.29.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "3", features = ["platform-verifier"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3"
