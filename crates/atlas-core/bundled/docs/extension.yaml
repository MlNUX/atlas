#
# Doku-Suche: die Dokumentation von Python-Paketen (pandas, numpy,
# matplotlib …) lokal durchsuchen – nach Namen, Rückgabetyp, Parametern,
# Klasse/Modul, Art und Paket – in einem eigenen Fenster wie die
# Projektsuche. Der Index entsteht aus den installierten Paketen (Befehl
# „index“, index.py) und liegt im Cache-Ordner der Erweiterung.
atlas_api: 2
name: docs
title: Doku-Suche
version: 1.0.0
description: Dokumentation von pandas, numpy, matplotlib & Co. lokal durchsuchen – mit Filtern für Rückgabetyp, Parameter, Klasse und Art.
context: true                 # als Karte in der Kontextleiste (abschaltbar)

permissions:
  run: [python3]              # index.sh startet das Python der Umgebung
  files: none                 # nur der eigene Cache-Ordner
  network: false

settings:
  - key: pakete
    title: Pakete
    description: Python-Pakete, deren Dokumentation in den Index kommt (Komma oder Leerzeichen).
    type: string
    default: numpy, pandas, matplotlib, scipy, seaborn, sklearn
  - key: python
    title: Python
    description: Leer – automatisch (.venv/venv/env des Projekts, aktive Conda-Umgebung, python3). Sonst der Pfad zum Python der Umgebung mit den Paketen.
    type: path
    default: ""

commands:
  - id: index
    name: Doku-Index neu bauen
    description: Liest die Dokumentation der Pakete aus der Python-Umgebung und baut den Index der Doku-Suche.
    command: ["{extension}/index.sh", "{cache}", "{project}", "{setting:python}", "{setting:pakete}"]
    terminal: background
    menu: [palette]

views:
  - id: search
    name: Doku-Suche
    page: docs.html
    window: true              # eigenes Fenster wie die Projektsuche
    keybinding: F1
