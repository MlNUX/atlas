[package]
name = "atlas-core"
description = "System and application core of Atlas Workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
blake3 = "1"
libc = "0.2"
crossbeam-channel = "0.5"
dirs = "6"
log = "0.4"
notify = "8"
poppler-rs = "0.26"
poppler-sys-rs = { version = "0.26", features = ["v25_6"] }
glib = "0.22"
cairo-rs = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
toml = "1.1.8"
ignore = "0.4.33"
uuid = { version = "1.28.0", features = ["v4"] }
trash = { version = "5.2.9", features = ["chrono"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
yaml-rust2 = "0.13.0"
pulldown-cmark-escape = "0.11.0"
regex = "1.13.1"

[dev-dependencies]
cairo-rs = { version = "0.22", features = ["pdf", "png", "v1_16"] }
tempfile = "3"
