[package]
name = "atlas-core"
description = "System and application core of Atlas Workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
blake3 = "1"
libc = "0.2"
crossbeam-channel = "0.5"
dirs = "6"
log = "0.4"
notify = "8"
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest", "thread_safe"] }
poppler-rs = "0.26"
glib = "0.22"
cairo-rs = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
toml = "1.1.8"
ignore = "0.4.33"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
cairo-rs = { version = "0.22", features = ["pdf", "png"] }
tempfile = "3"
