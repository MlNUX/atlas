[package]
name = "atlas-core"
description = "System and application core of Atlas Workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["pdf-poppler"]
# Rendering, text and export of PDFs (and .atlasnote pages) with poppler/cairo.
# Without it the core builds on macOS: PDF display is done by the UI, which
# hands page text to the core (pdf::set_page_texts / pdf::set_page_text_source).
pdf-poppler = ["dep:poppler-rs", "dep:poppler-sys-rs", "dep:glib", "dep:cairo-rs"]

[[example]]
name = "fixture"
required-features = ["pdf-poppler"]

[dependencies]
anyhow = "1"
blake3 = "1"
libc = "0.2"
crossbeam-channel = "0.5"
dirs = "6"
log = "0.4"
notify = "8"
# PDF engine on Linux (feature "pdf-poppler"); macOS uses PDFKit in Swift.
poppler-rs = { version = "0.26", optional = true }
poppler-sys-rs = { version = "0.26", features = ["v25_6"], optional = true }
glib = { version = "0.22", optional = true }
cairo-rs = { version = "0.22", features = ["pdf", "png", "v1_16"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Syntax highlighting (pure Rust regex engine, default syntaxes only).
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
thiserror = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
toml = "1.1.8"
ignore = "0.4.33"
globset = "0.4"
uuid = { version = "1.28.0", features = ["v4"] }
trash = { version = "5.2.9", features = ["chrono"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
yaml-rust2 = "0.13.0"
pulldown-cmark-escape = "0.11.0"
regex = "1.13.1"
roxmltree = "0.20"
ureq = { version = "3", features = ["platform-verifier"] }
scraper = "0.29.0"
ego-tree = "0.11"
chrono = "0.4"
chrono-tz = "0.10"
iana-time-zone = "0.1"
percent-encoding = "2"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-22"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"
